services:
  - type: web
    name: fraud-radar-engine
    runtime: python
    rootDir: engine
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9 # pydantic-core has no prebuilt wheel for Render's default 3.14 yet
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard — never commit a real key
      - key: CLAUDE_MODEL
        value: claude-sonnet-5

  - type: web
    name: fraud-radar-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma db push
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.22.2 # the start command uses node --env-file-if-exists, which needs Node >= 22.9
      - key: DATABASE_URL
        # Neon Postgres connection string — set manually in the Render dashboard.
        # Append &connect_timeout=30: free-tier Neon suspends when idle, and the
        # first connection after that fails under Prisma's default timeout.
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: ENGINE_URL
        sync: false # set to the fraud-radar-engine service's Render URL after it deploys
      - key: ENGINE_TIMEOUT_MS
        value: 60000 # a free-tier engine takes up to a minute to wake from sleep
      - key: ENGINE_EXPLAIN_TIMEOUT_MS
        value: 30000
      - key: ALLOW_DEMO_RESET
        value: "true" # team-only demo reset button; database is shared, keep this deliberate
